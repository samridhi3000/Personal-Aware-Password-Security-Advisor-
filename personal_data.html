{% extends "base.html" %}

{% block content %}
<div class="personal-data-container">
    <div class="personal-data-card">
        <h2>👤 Personal Information</h2>
        <p class="info-text">This information will be used to analyze password security. All data is encrypted and stored only on your device.</p>
        
        <form method="POST" class="personal-form">
            <!-- Basic Information -->
            <div class="form-section">
                <h3>Basic Information</h3>
                
                <div class="form-group">
                    <label>Full Name <span class="required">*</span></label>
                    <input type="text" name="full_name" required value="{{ data.full_name if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Nickname (optional)</label>
                    <input type="text" name="nickname" value="{{ data.nickname if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Date of Birth (DD/MM/YYYY) <span class="required">*</span></label>
                    <input type="text" name="dob" required pattern="\d{2}/\d{2}/\d{4}" 
                           placeholder="15/05/2000" value="{{ data.dob if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" name="phone" required value="{{ data.phone if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" name="email" required value="{{ data.email if data else '' }}">
                </div>
            </div>
            
            <!-- Social Media -->
            <div class="form-section">
                <h3>Social Media Handles</h3>
                
                <div class="form-group">
                    <label>Instagram (@username)</label>
                    <input type="text" name="instagram" placeholder="@username" value="{{ data.instagram if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Twitter/X (@username)</label>
                    <input type="text" name="twitter" placeholder="@username" value="{{ data.twitter if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Facebook (name)</label>
                    <input type="text" name="facebook" value="{{ data.facebook if data else '' }}">
                </div>
            </div>
            
            <!-- Additional Info -->
            <div class="form-section">
                <h3>Additional Information</h3>
                
                <div class="form-group">
                    <label>College/University</label>
                    <input type="text" name="college" value="{{ data.college if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>City</label>
                    <input type="text" name="city" value="{{ data.city if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Favorite Word 1</label>
                    <input type="text" name="fav_word1" value="{{ data.fav_word1 if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Favorite Word 2</label>
                    <input type="text" name="fav_word2" value="{{ data.fav_word2 if data else '' }}">
                </div>
                
                <div class="form-group">
                    <label>Favorite Word 3</label>
                    <input type="text" name="fav_word3" value="{{ data.fav_word3 if data else '' }}">
                </div>
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn btn-primary">💾 Save & Continue</button>
                <a href="{{ url_for('logout') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
